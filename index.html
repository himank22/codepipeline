<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Dodge Arena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070a14;--panel:#0d1222;--cyan:#39f6ff;--pink:#ff4fd8;--green:#65ff9a;--text:#edf7ff}
body{min-height:100vh;background:radial-gradient(circle at 50% 0%,#17264a 0,#090d1c 42%,#05070e 100%);font-family:Inter,system-ui,Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:min(1100px,96vw);padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand h1{font-size:clamp(22px,4vw,38px);letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 18px #39f6ff88}
.brand p{color:#8ea1bd;font-size:13px;margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:#0b1020cc;border:1px solid #263452;border-radius:12px;padding:9px 13px;min-width:82px;text-align:center;box-shadow:0 8px 24px #0005}
.stat small{display:block;color:#8190aa;font-size:10px;text-transform:uppercase;letter-spacing:1px}
.stat b{font-size:18px}
.game-shell{position:relative;border:1px solid #2b3b61;border-radius:20px;padding:8px;background:#080c18aa;box-shadow:0 25px 80px #0009,0 0 50px #39f6ff0d}
canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;border-radius:14px;background:#050811}
.overlay{position:absolute;inset:8px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#050811c9;backdrop-filter:blur(6px);text-align:center}
.overlay.hidden{display:none}
.card{width:min(430px,90%);padding:28px;border:1px solid #334566;background:#0b1122e8;border-radius:18px;box-shadow:0 20px 60px #0009}
.card h2{font-size:30px;letter-spacing:2px;margin-bottom:8px}
.card p{color:#9eacc3;line-height:1.6;margin-bottom:18px}
button{border:0;border-radius:11px;padding:11px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--cyan),#748cff);color:#06101b;box-shadow:0 0 24px #39f6ff33}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}
.help{display:flex;justify-content:space-between;gap:10px;color:#71819b;font-size:12px;padding:10px 3px 0}
kbd{border:1px solid #34445f;background:#10182a;border-radius:5px;padding:2px 6px;color:#c9d7eb}
.mobile{display:none;position:relative;margin:12px auto 0;width:190px;height:145px}
.mobile button{position:absolute;width:55px;height:45px;padding:0;background:#101a30;color:#c8d9ef;border:1px solid #334665;box-shadow:none}
.up{left:68px;top:0}.left{left:5px;top:50px}.down{left:68px;top:50px}.right{left:131px;top:50px}
@media(max-width:700px){body{overflow:auto;align-items:flex-start}.top{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.help{display:none}.mobile{display:block}.game-shell{padding:5px}.overlay{inset:5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>⚡ Neon Dodge Arena</h1>
      <p>Dodge the chaos. Collect energy. Beat your high score.</p>
    </div>
    <div class="stats">
      <div class="stat"><small>Score</small><b id="score">0</b></div>
      <div class="stat"><small>Best</small><b id="best">0</b></div>
      <div class="stat"><small>Level</small><b id="level">1</b></div>
      <div class="stat"><small>Lives</small><b id="lives">❤❤❤</b></div>
    </div>
  </div>

  <div class="game-shell">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="title">NEON DODGE</h2>
        <p id="message">Survive as long as possible. Dodge red meteors and collect cyan energy orbs.</p>
        <button id="start">START GAME</button>
      </div>
    </div>
  </div>

  <div class="help">
    <span>Move: <kbd>WASD</kbd> / <kbd>Arrow Keys</kbd></span>
    <span>Pause: <kbd>P</kbd> &nbsp; Restart: <kbd>R</kbd></span>
    <span>⚡ Energy orb = bonus &nbsp; ◆ Shield = protection</span>
  </div>

  <div class="mobile" id="mobile">
    <button class="up" data-key="ArrowUp">▲</button>
    <button class="left" data-key="ArrowLeft">◀</button>
    <button class="down" data-key="ArrowDown">▼</button>
    <button class="right" data-key="ArrowRight">▶</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),levelEl=document.getElementById("level"),livesEl=document.getElementById("lives");
const overlay=document.getElementById("overlay"),title=document.getElementById("title"),message=document.getElementById("message"),startBtn=document.getElementById("start");
let keys={},running=false,paused=false,last=0,score=0,level=1,lives=3,spawn=0,orbSpawn=0,shieldTime=0,shake=0;
let best=Number(localStorage.getItem("neonBest")||0);bestEl.textContent=best;
const player={x:W/2,y:H-70,r:17,speed:330};
let meteors=[],orbs=[],particles=[],stars=[];

for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.3,a:Math.random()*.7+.2});

function reset(){
 score=0;level=1;lives=3;spawn=0;orbSpawn=1;shieldTime=0;shake=0;
 player.x=W/2;player.y=H-70;meteors=[];orbs=[];particles=[];
 updateUI();
}
function startGame(){
 reset();running=true;paused=false;overlay.classList.add("hidden");last=performance.now();requestAnimationFrame(loop);
}
function gameOver(){
 running=false;
 if(score>best){best=score;localStorage.setItem("neonBest",best);bestEl.textContent=best}
 title.textContent="GAME OVER";
 message.innerHTML=`Final score: <b>${Math.floor(score)}</b><br>Best score: <b>${best}</b><br><br>Ready for another run?`;
 startBtn.textContent="PLAY AGAIN";
 overlay.classList.remove("hidden");
}
function updateUI(){
 scoreEl.textContent=Math.floor(score);
 levelEl.textContent=level;
 livesEl.textContent="❤".repeat(lives)+"♡".repeat(3-lives);
}
function addParticles(x,y,n=12,color="#39f6ff"){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*180+40;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.5,max:1,color,r:Math.random()*3+1})}
}
function spawnMeteor(){
 const r=10+Math.random()*18;
 meteors.push({x:r+Math.random()*(W-r*2),y:-30,r,vy:120+Math.random()*100+level*16,vx:(Math.random()-.5)*35,rot:Math.random()*6});
}
function spawnOrb(){
 orbs.push({x:25+Math.random()*(W-50),y:-20,r:9,vy:105+Math.random()*45,spin:0});
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function hitMeteor(m){
 if(shieldTime>0){shieldTime=0;addParticles(m.x,m.y,20,"#65ff9a");return}
 lives--;shake=10;addParticles(player.x,player.y,25,"#ff4fd8");
 if(lives<=0)gameOver();
}
function update(dt){
 const dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
 const dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
 const len=Math.hypot(dx,dy)||1;
 player.x+=dx/len*player.speed*dt;player.y+=dy/len*player.speed*dt;
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));
 level=1+Math.floor(score/800);
 spawn-=dt;orbSpawn-=dt;
 const spawnRate=Math.max(.18,.75-level*.045);
 if(spawn<=0){spawnMeteor();spawn=spawnRate}
 if(orbSpawn<=0){spawnOrb();orbSpawn=2.5+Math.random()*3}
 shieldTime=Math.max(0,shieldTime-dt);
 for(const m of meteors){m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=dt*3}
 for(const o of orbs){o.y+=o.vy*dt;o.spin+=dt*5}
 for(let i=meteors.length-1;i>=0;i--){
  const m=meteors[i];
  if(dist(player,m)<player.r+m.r){hitMeteor(m);meteors.splice(i,1);continue}
  if(m.y>H+50)meteors.splice(i,1);
 }
 for(let i=orbs.length-1;i>=0;i--){
  const o=orbs[i];
  if(dist(player,o)<player.r+o.r+5){score+=150;addParticles(o.x,o.y,18,"#39f6ff");orbs.splice(i,1);continue}
  if(o.y>H+30)orbs.splice(i,1);
 }
 score+=dt*(35+level*8);
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }
 if(shake>0)shake-=dt*30;
 updateUI();
}
function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#050b19");g.addColorStop(1,"#03050c");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#16243e";ctx.lineWidth=1;
 for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle="#b8d9ff";ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;

 for(const m of meteors){
  ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);
  ctx.shadowBlur=18;ctx.shadowColor="#ff3b78";ctx.fillStyle="#ff3b78";
  ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,rr=m.r*(.75+Math.random()*.3);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();
  ctx.fillStyle="#ff9aaf";ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(-m.r*.25,-m.r*.2,m.r*.35,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 for(const o of orbs){
  ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.spin);ctx.shadowBlur=22;ctx.shadowColor="#39f6ff";ctx.fillStyle="#39f6ff";
  ctx.beginPath();ctx.moveTo(0,-o.r);ctx.lineTo(o.r,0);ctx.lineTo(0,o.r);ctx.lineTo(-o.r,0);ctx.closePath();ctx.fill();ctx.restore();
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;

 // player
 ctx.save();ctx.translate(player.x,player.y);
 ctx.shadowBlur=25;ctx.shadowColor=shieldTime>0?"#65ff9a":"#39f6ff";
 ctx.fillStyle=shieldTime>0?"#65ff9a":"#39f6ff";
 ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(17,15);ctx.lineTo(0,9);ctx.lineTo(-17,15);ctx.closePath();ctx.fill();
 ctx.fillStyle="#07111e";ctx.beginPath();ctx.arc(0,2,5,0,Math.PI*2);ctx.fill();
 if(shieldTime>0){ctx.strokeStyle="#65ff9a";ctx.lineWidth=3;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.stroke()}
 ctx.restore();

 if(shieldTime>0){ctx.fillStyle="#65ff9a";ctx.font="bold 13px system-ui";ctx.fillText("SHIELD",player.x-27,player.y-35)}
 ctx.restore();
}
function loop(t){
 if(!running)return;
 const dt=Math.min((t-last)/1000,.033);last=t;
 if(!paused){update(dt);draw()}else draw();
 requestAnimationFrame(loop);
}
function togglePause(){
 if(!running)return;paused=!paused;
 if(paused){title.textContent="PAUSED";message.textContent="Press P to continue.";startBtn.textContent="RESUME";overlay.classList.remove("hidden")}
 else overlay.classList.add("hidden");
}
window.addEventListener("keydown",e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 keys[k]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(k==="p")togglePause();
 if(k==="r"&&!running)startGame();
});
window.addEventListener("keyup",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
startBtn.onclick=()=>{if(paused){togglePause()}else startGame()};
document.querySelectorAll(".mobile button").forEach(b=>{
 const k=b.dataset.key;
 const on=e=>{e.preventDefault();keys[k]=true};
 const off=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off,{passive:false});
 b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off);
});
draw();
</script>
</body>
</html>
